[package]
name = "data-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.37.0", features = ["full"] }
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "postgres", "macros"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
tower-http = { version = "0.5.2", features = ["cors"] }
dotenvy = "0.15.7"
