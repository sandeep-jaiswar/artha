---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal
  namespace: artha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terminal
  template:
    metadata:
      labels:
        app: terminal
    spec:
      containers:
      - name: terminal
        image: artha-terminal:latest
        envFrom:
        - configMapRef:
            name: artha-config
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: terminal
  namespace: artha
spec:
  type: LoadBalancer
  selector:
    app: terminal
  ports:
  - port: 80
    targetPort: 3000
