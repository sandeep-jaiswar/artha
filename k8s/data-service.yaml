---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: artha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      containers:
      - name: data-service
        image: artha-data-service:latest
        envFrom:
        - configMapRef:
            name: artha-config
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: artha
spec:
  selector:
    app: data-service
  ports:
  - port: 8001
    targetPort: 8001
