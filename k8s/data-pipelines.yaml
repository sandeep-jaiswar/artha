---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-pipelines
  namespace: artha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-pipelines
  template:
    metadata:
      labels:
        app: data-pipelines
    spec:
      containers:
      - name: data-pipelines
        image: artha-data-pipelines:latest
        envFrom:
        - configMapRef:
            name: artha-config
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: data-pipelines
  namespace: artha
spec:
  selector:
    app: data-pipelines
  ports:
  - port: 8000
    targetPort: 8000
