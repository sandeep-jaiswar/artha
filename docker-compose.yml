# docker-compose.yml
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  data-service:
    build:
      context: ./apps/data-service
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/artha
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  data-pipelines:
    build:
      context: ./apps/data-pipelines
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/artha
      PIPELINE_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  terminal:
    build:
      context: ./apps/terminal
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - data-service

volumes:
  postgres_data:
